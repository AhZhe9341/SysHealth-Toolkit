name: Windows tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -ErrorAction Stop
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force -ErrorAction Stop
      - name: Analyze PowerShell scripts
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $issues = @(Invoke-ScriptAnalyzer -Path . -Recurse)
          if ($issues.Count) {
            $issues | Format-Table -AutoSize
            exit 1
          }
      - name: Run Pester
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./tests -Output Detailed -CI
